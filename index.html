<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0;url=https://vslh.ru/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>Переход на сайт</title>
<link rel="icon" href="data:,">
<style>
html{background:#111111}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center}
.loader{position:relative;text-decoration:none}
.redirect-link{position:absolute;top:calc(100% + 24px);left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;padding:8px 0;color:#808080;font:14px/1.5 Arial,sans-serif;text-align:center;text-decoration:none}
.redirect-link:hover{color:#96968f;text-decoration:underline}
.sound-mark{display:flex;align-items:center;justify-content:space-between;width:75vh;width:75dvh;max-width:80vw;height:calc(100vh / 3);height:calc(100dvh / 3)}
.sound-mark i{flex:0 0 calc(100% / 15);height:var(--h,30%);background:#ff593d;animation:wave .84s ease-in-out var(--d,0s) infinite}
a:focus-visible{outline:2px solid #ff593d;outline-offset:8px}
@keyframes wave{0%,100%{transform:scaleY(.35)}
50%{transform:scaleY(1)}
}
@media (prefers-reduced-motion:reduce){.sound-mark i{animation:none}
}
</style>
</head>
<body>
<a class="loader" href="https://vslh.ru/">
<span class="sound-mark" aria-hidden="true">
<i></i><i style="--h:60%;--d:-.72s"></i><i style="--h:100%;--d:-.6s"></i><i style="--h:70%;--d:-.48s"></i><i style="--h:100%;--d:-.36s"></i><i style="--h:60%;--d:-.24s"></i><i style="--d:-.12s"></i>
</span>
<span class="redirect-link">Переход на сайт. Нажмите, если переход не произошёл.</span>
</a>
</body>
</html>
